name: Docker Store contracts (no router needed)
on:
  pull_request:
    paths:
      - 'integrations/docker-manager/moci-app-docker/**'
      - 'moci/**'
      - 'tests/service-controls.test.mjs'
      - 'tests/docker-store-contract.py'
      - '.github/workflows/docker-store-contract.yml'
  workflow_dispatch:
jobs:
  static-and-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python adapters and test harness
        run: |
          python -m py_compile integrations/docker-manager/moci-app-docker/files/moci-docker-api
          python -m py_compile integrations/docker-manager/moci-app-docker/files/moci-docker-policy
          python -m py_compile integrations/docker-manager/moci-app-docker/files/moci-docker-firewall
          python -m py_compile tests/docker-store-contract.py
      - name: Check all catalogue entries and install-security contracts
        run: python tests/docker-store-contract.py
      - name: Check MoCI frontend and Docker add-on JavaScript
        run: |
          node --check moci/js/core.js
          node --check moci/js/modules/network.js
          node --check moci/js/modules/system.js
          node --check tests/service-controls.test.mjs
          node --check moci/js/modules/upnp.js
          node --check moci/js/modules/advanced.js
          node --check moci/js/modules/wifi-schedules.js
          node --check moci/js/modules/wifi-profiles.js
          node --check moci/js/modules/vpn-policies.js
          node --check moci/js/modules/dashboard.js
          node --check integrations/docker-manager/moci-app-docker/files/addon.js
      - name: Test real service status and start/stop failure handling
        run: node tests/service-controls.test.mjs
      - name: Build frontend package
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/moci/js/core.js
          test -s dist/moci/index.html
          test -s dist/moci/js/modules/upnp.js
