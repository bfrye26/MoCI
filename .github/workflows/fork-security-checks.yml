name: Fork security checks
on:
  push:
    branches: [dev, 'develop/**']
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moci-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check moci/js/core.js
          for script in moci/js/modules/*.js; do node --check "$script"; done
          sh -n files/moci-wifi-scheduler
          sh -n files/init-moci-wifi-scheduler
      - name: Reject stored password regression
        run: |
          ! grep -R -nE "localStorage\.setItem\(['\"]saved_credentials|saveCredentials\(|autoLogin\(|Remember credentials" moci
          ! grep -R -n "localStorage.setItem('ubus_session'" moci
      - name: Validate Docker source when imported
        run: |
          if test -d integrations/docker-manager/moci-app-docker; then
            python3 -m unittest discover -s integrations/docker-manager/tests -p 'test*.py'
            node --check integrations/docker-manager/moci-app-docker/files/addon.js
            python3 -m py_compile integrations/docker-manager/moci-app-docker/files/moci-docker-api
            python3 -m py_compile integrations/docker-manager/moci-app-docker/files/moci-docker-policy
          else
            echo "Docker package has not yet been imported; source integration pending."
          fi
